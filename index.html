<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>POST ONLY</title>

  <style>
    *{box-sizing:border-box}

    body{
      margin:0;
      background:#f4f4f2;
      font-family:system-ui;
      color:#111
    }

    main{
      max-width:540px;
      min-height:100vh;
      margin:auto;
      background:#fff;
      padding:28px 20px
    }

    h1{margin:4px 0}

    .sub{color:#777}

    .pick{
      display:block;
      min-height:200px;
      border:2px dashed #bbb;
      border-radius:20px;
      overflow:hidden;
      cursor:pointer;
      padding:16px
    }

    #pickText{
      min-height:165px;
      display:grid;
      place-items:center;
      font-weight:800;
      text-align:center
    }

    #preview{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:10px
    }

    #preview img{
      width:100%;
      aspect-ratio:4/5;
      object-fit:contain;
      background:#fff;
      border-radius:12px
    }

    textarea{
      width:100%;
      min-height:140px;
      margin-top:16px;
      border:1px solid #ddd;
      border-radius:16px;
      padding:14px;
      font:inherit
    }

    .targets{
      display:flex;
      gap:10px;
      margin:14px 0
    }

    .targets label{
      flex:1;
      border:1px solid #ddd;
      border-radius:14px;
      padding:14px
    }

    button{
      width:100%;
      border:0;
      border-radius:16px;
      background:#111;
      color:#fff;
      padding:17px;
      font-size:17px;
      font-weight:800
    }

    button:disabled{
      opacity:.55
    }

    #status{
      text-align:center;
      min-height:52px;
      padding:16px;
      font-weight:750;
      overflow-wrap:anywhere
    }

    .note{
      text-align:center;
      color:#999;
      font-size:12px
    }
  </style>
</head>

<body>
<main>

  <h1>POST ONLY</h1>
  <p class="sub">見る機能はありません。投稿するだけ。</p>

  <label class="pick">
    <input
      id="file"
      type="file"
      accept="image/*"
      multiple
      hidden
    >

    <span id="pickText">
      画像を選ぶ<br>
      <small>Instagramは最大10枚</small>
    </span>

    <div id="preview"></div>
  </label>

  <textarea
    id="caption"
    placeholder="投稿文"
  ></textarea>

  <div class="targets">

    <label>
      <input
        id="toX"
        type="checkbox"
        checked
      >
      X
    </label>

    <label>
      <input
        id="toIg"
        type="checkbox"
      >
      Instagram
    </label>

  </div>

  <button id="send">
    投稿する
  </button>

  <div id="status"></div>

  <div class="note">
    タイムライン・通知・いいね・コメントは取得しません。
  </div>


<script>

const file =
  document.querySelector("#file");

const preview =
  document.querySelector("#preview");

const pickText =
  document.querySelector("#pickText");

const caption =
  document.querySelector("#caption");

const toX =
  document.querySelector("#toX");

const toIg =
  document.querySelector("#toIg");

const send =
  document.querySelector("#send");

const status =
  document.querySelector("#status");


file.onchange = () => {

  preview.innerHTML = "";

  const files =
    Array.from(file.files || []);

  if (!files.length) {
    pickText.style.display = "grid";
    return;
  }

  pickText.style.display = "none";

  for (const f of files) {

    const img =
      document.createElement("img");

    img.src =
      URL.createObjectURL(f);

    img.onload = () => {
      URL.revokeObjectURL(img.src);
    };

    preview.appendChild(img);
  }
};


function b64(f) {

  return new Promise((res, rej) => {

    const r =
      new FileReader();

    r.onload = () => {

      const result =
        String(r.result);

      res(
        result.split(",")[1]
      );
    };

    r.onerror = rej;

    r.readAsDataURL(f);
  });
}


/*
  Instagram用画像生成

  元画像は切らない。
  1080 × 1350 の白いキャンバスに
  縦横比を維持したまま中央配置。
*/

async function makeInstagramImage(f) {

  const bitmap =
    await createImageBitmap(f);

  const canvas =
    document.createElement("canvas");

  const targetWidth = 1080;
  const targetHeight = 1350;

  canvas.width =
    targetWidth;

  canvas.height =
    targetHeight;

  const ctx =
    canvas.getContext("2d");

  ctx.fillStyle =
    "#ffffff";

  ctx.fillRect(
    0,
    0,
    targetWidth,
    targetHeight
  );

  const scale =
    Math.min(
      targetWidth / bitmap.width,
      targetHeight / bitmap.height
    );

  const drawWidth =
    Math.round(
      bitmap.width * scale
    );

  const drawHeight =
    Math.round(
      bitmap.height * scale
    );

  const x =
    Math.round(
      (targetWidth - drawWidth) / 2
    );

  const y =
    Math.round(
      (targetHeight - drawHeight) / 2
    );

  ctx.drawImage(
    bitmap,
    x,
    y,
    drawWidth,
    drawHeight
  );

  bitmap.close();

  const dataUrl =
    canvas.toDataURL(
      "image/jpeg",
      0.92
    );

  return {
    imageBase64:
      dataUrl.split(",")[1],

    mimeType:
      "image/jpeg"
  };
}


send.onclick = async () => {

  const text =
    caption.value.trim();

  const files =
    Array.from(file.files || []);


  if (!text) {

    status.textContent =
      "投稿文を入力してください";

    return;
  }


  if (
    !toX.checked &&
    !toIg.checked
  ) {

    status.textContent =
      "投稿先を選んでください";

    return;
  }


  if (
    toIg.checked &&
    files.length === 0
  ) {

    status.textContent =
      "Instagram投稿には画像が必要です";

    return;
  }


  if (
    toIg.checked &&
    files.length > 10
  ) {

    status.textContent =
      "Instagramは最大10枚です";

    return;
  }


  send.disabled = true;

  status.textContent =
    "画像を準備しています…";


  try {

    const body = {

      caption: text,

      x:
        toX.checked,

      instagram:
        toIg.checked,

      images: []
    };


    /*
      Instagramを使う場合

      全画像を4:5キャンバスへ変換して
      images[] に入れる
    */

    if (
      toIg.checked &&
      files.length
    ) {

      for (
        let i = 0;
        i < files.length;
        i++
      ) {

        status.textContent =
          `Instagram用画像を処理中… ${i + 1}/${files.length}`;

        const image =
          await makeInstagramImage(
            files[i]
          );

        body.images.push(image);
      }
    }


    /*
      Xだけの場合

      現在の仕様を壊さないため、
      最初の画像を従来形式でも送る
    */

    if (
      toX.checked &&
      !toIg.checked &&
      files.length
    ) {

      body.imageBase64 =
        await b64(files[0]);

      body.mimeType =
        files[0].type ||
        "image/jpeg";
    }


    /*
      X + Instagram同時投稿の場合

      XにはInstagram用に変換した
      最初の画像を渡す
    */

    if (
      toX.checked &&
      toIg.checked &&
      body.images.length
    ) {

      body.imageBase64 =
        body.images[0].imageBase64;

      body.mimeType =
        body.images[0].mimeType;
    }


    /*
      Instagram旧1枚形式との
      互換性も残しておく
    */

    if (
      body.images.length === 1
    ) {

      body.imageBase64 =
        body.images[0].imageBase64;

      body.mimeType =
        body.images[0].mimeType;
    }


    status.textContent =
      "投稿中…";


    const r =
      await fetch(
        "/api/publish",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(body)
        }
      );


    let j;

    try {

      j = await r.json();

    } catch {

      throw new Error(
        `サーバー応答エラー (${r.status})`
      );
    }


    console.log(
      "publish response:",
      j
    );


    if (j.ok) {

      status.textContent =
        "✓ 投稿しました";

    } else {

      status.textContent =
        j.errors?.instagram ||
        j.errors?.x ||
        j.error ||
        "投稿できませんでした";
    }


  } catch (e) {

    console.error(e);

    status.textContent =
      e?.message ||
      "画像処理または接続でエラーが発生しました";

  } finally {

    send.disabled = false;
  }
};

</script>

</main>
</body>
</html>
