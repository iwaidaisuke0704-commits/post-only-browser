<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>POST ONLY</title>

  <style>
    *{box-sizing:border-box}

    body{
      margin:0;
      background:#f4f4f2;
      font-family:system-ui;
      color:#111
    }

    main{
      max-width:540px;
      min-height:100vh;
      margin:auto;
      background:#fff;
      padding:28px 20px
    }

    h1{margin:4px 0}
    .sub{color:#777}

    .pick{
      display:block;
      min-height:200px;
      border:2px dashed #bbb;
      border-radius:20px;
      overflow:hidden;
      cursor:pointer;
      padding:16px
    }

    #pickText{
      min-height:165px;
      display:grid;
      place-items:center;
      font-weight:800;
      text-align:center
    }

    #preview{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:10px
    }

    .previewItem{
      position:relative
    }

    .previewItem img{
      display:block;
      width:100%;
      aspect-ratio:4/5;
      object-fit:contain;
      background:#fff;
      border-radius:12px;
      border:1px solid #eee
    }

    .removeImage{
      position:absolute;
      top:7px;
      right:7px;
      width:34px;
      height:34px;
      padding:0;
      border:0;
      border-radius:50%;
      background:rgba(0,0,0,.78);
      color:#fff;
      font-size:22px;
      font-weight:700;
      line-height:34px;
      cursor:pointer
    }

    .imageTools{
      display:none;
      align-items:center;
      gap:8px;
      margin-top:10px
    }

    #imageCount{
      color:#666;
      font-size:14px;
      font-weight:700;
      margin-right:auto;
      white-space:nowrap
    }

    #addImages,
    #clearImages{
      width:auto;
      padding:10px 12px;
      border:1px solid #ddd;
      border-radius:10px;
      background:#fff;
      color:#333;
      font-size:13px;
      font-weight:700;
      cursor:pointer
    }

    #addImages{
      background:#111;
      color:#fff;
      border-color:#111
    }

    textarea{
      width:100%;
      min-height:140px;
      margin-top:16px;
      border:1px solid #ddd;
      border-radius:16px;
      padding:14px;
      font:inherit
    }

    .targets{
      display:flex;
      gap:10px;
      margin:14px 0
    }

    .targets label{
      flex:1;
      border:1px solid #ddd;
      border-radius:14px;
      padding:14px
    }


    /* =====================================
       投稿タイミング
    ===================================== */

    .timing{
      margin:14px 0;
      border:1px solid #ddd;
      border-radius:16px;
      padding:14px
    }

    .timingTitle{
      margin-bottom:12px;
      font-size:14px;
      font-weight:800
    }

    .timingChoices{
      display:flex;
      gap:10px
    }

    .timingChoices label{
      flex:1;
      display:flex;
      align-items:center;
      gap:7px;
      padding:12px;
      border:1px solid #ddd;
      border-radius:12px;
      cursor:pointer
    }


    /* =====================================
       予約日時
    ===================================== */

    #scheduleBox{
      display:none;
      margin-top:12px
    }

    /*
      実際のdatetime-localは透明にして
      ボタン全体に重ねる
    */

    .schedulePicker{
      position:relative;
      width:100%;
    }

    #scheduleDisplay{
      width:100%;
      min-height:58px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:14px 16px;
      border:1px solid #ddd;
      border-radius:12px;
      background:#fff;
      color:#777;
      font:inherit;
      font-size:16px;
      font-weight:650;
      text-align:left;
      cursor:pointer
    }

    #scheduleDisplay.hasValue{
      color:#111
    }

    #scheduleDisplay::after{
      content:"›";
      flex:none;
      color:#777;
      font-size:24px;
      line-height:1;
      transform:rotate(90deg)
    }

    #scheduleAt{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      opacity:0;
      cursor:pointer
    }


    /* =====================================
       投稿ボタン
    ===================================== */

    #send{
      width:100%;
      border:0;
      border-radius:16px;
      background:#111;
      color:#fff;
      padding:17px;
      font-size:17px;
      font-weight:800;
      cursor:pointer
    }

    button:disabled{
      opacity:.55
    }

    #status{
      text-align:center;
      min-height:52px;
      padding:16px;
      font-weight:750;
      overflow-wrap:anywhere
    }

    .note{
      text-align:center;
      color:#999;
      font-size:12px
    }
  </style>
</head>

<body>
<main>

  <h1>POST ONLY</h1>

  <p class="sub">
    見る機能はありません。投稿するだけ。
  </p>


  <!-- ===================================
       画像
  ==================================== -->

  <label class="pick">

    <input
      id="file"
      type="file"
      accept="image/*"
      multiple
      hidden
    >

    <span id="pickText">
      画像を選ぶ<br>
      <small>
        Xは最大4枚 / Instagramは最大10枚
      </small>
    </span>

    <div id="preview"></div>

  </label>


  <div
    id="imageTools"
    class="imageTools"
  >

    <span id="imageCount"></span>

    <button
      id="addImages"
      type="button"
    >
      ＋ 画像を追加
    </button>

    <button
      id="clearImages"
      type="button"
    >
      全部消す
    </button>

  </div>


  <!-- ===================================
       投稿文
  ==================================== -->

  <textarea
    id="caption"
    placeholder="投稿文"
  ></textarea>


  <!-- ===================================
       投稿先
  ==================================== -->

  <div class="targets">

    <label>
      <input
        id="toX"
        type="checkbox"
        checked
      >
      X
    </label>

    <label>
      <input
        id="toIg"
        type="checkbox"
      >
      Instagram
    </label>

  </div>


  <!-- ===================================
       投稿タイミング
  ==================================== -->

  <div class="timing">

    <div class="timingTitle">
      投稿タイミング
    </div>

    <div class="timingChoices">

      <label>
        <input
          id="postNow"
          type="radio"
          name="timing"
          value="now"
          checked
        >
        今すぐ
      </label>

      <label>
        <input
          id="postLater"
          type="radio"
          name="timing"
          value="scheduled"
        >
        予約
      </label>

    </div>


    <!--
      ここが修正版。

      空欄ではなく
      「予約日時を選ぶ」
      が必ず表示される。
    -->

    <div id="scheduleBox">

      <div class="schedulePicker">

        <div id="scheduleDisplay">
          予約日時を選ぶ
        </div>

        <input
          id="scheduleAt"
          type="datetime-local"
          aria-label="予約日時を選ぶ"
        >

      </div>

    </div>

  </div>


  <!-- ===================================
       投稿ボタン
  ==================================== -->

  <button id="send">
    投稿する
  </button>


  <div id="status"></div>


  <div class="note">
    タイムライン・通知・いいね・コメントは取得しません。
  </div>


<script>

const file =
  document.querySelector("#file");

const preview =
  document.querySelector("#preview");

const pickText =
  document.querySelector("#pickText");

const imageTools =
  document.querySelector("#imageTools");

const imageCount =
  document.querySelector("#imageCount");

const addImages =
  document.querySelector("#addImages");

const clearImages =
  document.querySelector("#clearImages");

const caption =
  document.querySelector("#caption");

const toX =
  document.querySelector("#toX");

const toIg =
  document.querySelector("#toIg");

const send =
  document.querySelector("#send");

const status =
  document.querySelector("#status");

const postNow =
  document.querySelector("#postNow");

const postLater =
  document.querySelector("#postLater");

const scheduleBox =
  document.querySelector("#scheduleBox");

const scheduleAt =
  document.querySelector("#scheduleAt");

const scheduleDisplay =
  document.querySelector("#scheduleDisplay");


/* ========================================
   現在選択中の画像
======================================== */

let selectedFiles = [];


/* ========================================
   予約UI
======================================== */

function updateTimingUI() {

  if (postLater.checked) {

    scheduleBox.style.display =
      "block";

    send.textContent =
      "投稿を予約する";

  } else {

    scheduleBox.style.display =
      "none";

    send.textContent =
      "投稿する";
  }
}


postNow.onchange =
  updateTimingUI;

postLater.onchange =
  updateTimingUI;


/*
  過去日時を選びにくくする
*/

function updateMinimumScheduleTime() {

  const now =
    new Date();

  now.setMinutes(
    now.getMinutes() -
    now.getTimezoneOffset()
  );

  scheduleAt.min =
    now
      .toISOString()
      .slice(0,16);
}


updateMinimumScheduleTime();


/*
  ========================================
  予約日時の表示更新
  ========================================
*/

function updateScheduleDisplay() {

  if (!scheduleAt.value) {

    scheduleDisplay.textContent =
      "予約日時を選ぶ";

    scheduleDisplay.classList.remove(
      "hasValue"
    );

    return;
  }


  const date =
    new Date(
      scheduleAt.value
    );


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    scheduleDisplay.textContent =
      "予約日時を選ぶ";

    scheduleDisplay.classList.remove(
      "hasValue"
    );

    return;
  }


  const formatter =
    new Intl.DateTimeFormat(
      "ja-JP",
      {
        year:"numeric",
        month:"numeric",
        day:"numeric",
        weekday:"short",
        hour:"2-digit",
        minute:"2-digit"
      }
    );


  scheduleDisplay.textContent =
    formatter.format(
      date
    );


  scheduleDisplay.classList.add(
    "hasValue"
  );
}


scheduleAt.addEventListener(
  "change",
  updateScheduleDisplay
);

scheduleAt.addEventListener(
  "input",
  updateScheduleDisplay
);


/* ========================================
   プレビュー
======================================== */

function renderPreview() {

  preview.innerHTML = "";


  if (!selectedFiles.length) {

    pickText.style.display =
      "grid";

    imageTools.style.display =
      "none";

    imageCount.textContent =
      "";

    return;
  }


  pickText.style.display =
    "none";

  imageTools.style.display =
    "flex";

  imageCount.textContent =
    `${selectedFiles.length}枚選択中`;


  selectedFiles.forEach(
    (f, index) => {

      const item =
        document.createElement("div");

      item.className =
        "previewItem";


      const img =
        document.createElement("img");

      const objectUrl =
        URL.createObjectURL(f);

      img.src =
        objectUrl;


      img.onload = () => {

        URL.revokeObjectURL(
          objectUrl
        );
      };


      const remove =
        document.createElement("button");

      remove.type =
        "button";

      remove.className =
        "removeImage";

      remove.textContent =
        "×";

      remove.setAttribute(
        "aria-label",
        `${index + 1}枚目を削除`
      );


      remove.onclick = (e) => {

        e.preventDefault();
        e.stopPropagation();

        selectedFiles.splice(
          index,
          1
        );

        renderPreview();

        status.textContent =
          "";
      };


      item.appendChild(
        img
      );

      item.appendChild(
        remove
      );

      preview.appendChild(
        item
      );
    }
  );
}


/* ========================================
   ＋画像を追加
======================================== */

addImages.onclick = (e) => {

  e.preventDefault();
  e.stopPropagation();

  file.click();
};


/* ========================================
   画像選択
======================================== */

file.onchange = () => {

  const newFiles =
    Array.from(
      file.files || []
    );


  if (!newFiles.length) {
    return;
  }


  selectedFiles = [
    ...selectedFiles,
    ...newFiles
  ];


  if (
    selectedFiles.length > 10
  ) {

    selectedFiles =
      selectedFiles.slice(
        0,
        10
      );

    status.textContent =
      "画像は最大10枚までです";

  } else {

    status.textContent =
      "";
  }


  renderPreview();

  file.value = "";
};


/* ========================================
   全部消す
======================================== */

clearImages.onclick = (e) => {

  e.preventDefault();
  e.stopPropagation();

  selectedFiles = [];

  file.value = "";

  renderPreview();

  status.textContent =
    "";
};


/* ========================================
   Base64
======================================== */

function b64(f) {

  return new Promise(
    (res, rej) => {

      const r =
        new FileReader();


      r.onload = () => {

        const result =
          String(
            r.result
          );

        res(
          result.split(",")[1]
        );
      };


      r.onerror =
        rej;


      r.readAsDataURL(
        f
      );
    }
  );
}


/* ========================================
   Instagram画像生成
======================================== */

async function makeInstagramImage(
  f
) {

  const bitmap =
    await createImageBitmap(
      f
    );


  const canvas =
    document.createElement(
      "canvas"
    );


  const targetWidth =
    1080;

  const targetHeight =
    1350;


  canvas.width =
    targetWidth;

  canvas.height =
    targetHeight;


  const ctx =
    canvas.getContext(
      "2d"
    );


  ctx.fillStyle =
    "#ffffff";


  ctx.fillRect(
    0,
    0,
    targetWidth,
    targetHeight
  );


  const scale =
    Math.min(

      targetWidth /
        bitmap.width,

      targetHeight /
        bitmap.height
    );


  const drawWidth =
    Math.round(
      bitmap.width *
      scale
    );


  const drawHeight =
    Math.round(
      bitmap.height *
      scale
    );


  const x =
    Math.round(
      (
        targetWidth -
        drawWidth
      ) / 2
    );


  const y =
    Math.round(
      (
        targetHeight -
        drawHeight
      ) / 2
    );


  ctx.drawImage(
    bitmap,
    x,
    y,
    drawWidth,
    drawHeight
  );


  bitmap.close();


  const dataUrl =
    canvas.toDataURL(
      "image/jpeg",
      0.92
    );


  return {

    imageBase64:
      dataUrl.split(",")[1],

    mimeType:
      "image/jpeg"
  };
}


/* ========================================
   投稿
======================================== */

send.onclick = async () => {

  const text =
    caption.value.trim();

  const files =
    [...selectedFiles];


  if (!text) {

    status.textContent =
      "投稿文を入力してください";

    return;
  }


  if (
    !toX.checked &&
    !toIg.checked
  ) {

    status.textContent =
      "投稿先を選んでください";

    return;
  }


  if (
    toIg.checked &&
    files.length === 0
  ) {

    status.textContent =
      "Instagram投稿には画像が必要です";

    return;
  }


  if (
    toIg.checked &&
    files.length > 10
  ) {

    status.textContent =
      "Instagramは最大10枚です";

    return;
  }


  if (
    toX.checked &&
    files.length > 4
  ) {

    status.textContent =
      "Xは最大4枚です";

    return;
  }


  /* ======================================
     予約日時チェック
  ====================================== */

  if (postLater.checked) {

    if (!scheduleAt.value) {

      status.textContent =
        "予約日時を選んでください";

      return;
    }


    const scheduledDate =
      new Date(
        scheduleAt.value
      );


    if (
      Number.isNaN(
        scheduledDate.getTime()
      )
    ) {

      status.textContent =
        "予約日時が正しくありません";

      return;
    }


    if (
      scheduledDate.getTime() <=
      Date.now()
    ) {

      status.textContent =
        "未来の日時を選んでください";

      return;
    }


    /*
      まだ予約サーバー未接続。
      次はここを/api/scheduleへ繋ぐ。
    */

    status.textContent =
      "予約UIはOK。次にサーバー側を接続します";

    return;
  }


  /* ======================================
     今すぐ投稿
  ====================================== */

  send.disabled =
    true;

  addImages.disabled =
    true;

  clearImages.disabled =
    true;


  status.textContent =
    "画像を準備しています…";


  try {

    const body = {

      caption:
        text,

      x:
        toX.checked,

      instagram:
        toIg.checked,

      images: [],

      xImages: []
    };


    /*
      X用画像
    */

    if (
      toX.checked &&
      files.length
    ) {

      for (
        let i = 0;
        i < files.length;
        i++
      ) {

        status.textContent =
          `X用画像を準備中… ${i + 1}/${files.length}`;


        body.xImages.push({

          imageBase64:
            await b64(
              files[i]
            ),

          mimeType:
            files[i].type ||
            "image/jpeg"
        });
      }
    }


    /*
      Instagram用画像
    */

    if (
      toIg.checked &&
      files.length
    ) {

      for (
        let i = 0;
        i < files.length;
        i++
      ) {

        status.textContent =
          `Instagram用画像を処理中… ${i + 1}/${files.length}`;


        const image =
          await makeInstagramImage(
            files[i]
          );


        body.images.push(
          image
        );
      }
    }


    /*
      旧1枚形式との互換性
    */

    if (
      body.xImages.length
    ) {

      body.imageBase64 =
        body.xImages[0]
          .imageBase64;

      body.mimeType =
        body.xImages[0]
          .mimeType;

    } else if (
      body.images.length
    ) {

      body.imageBase64 =
        body.images[0]
          .imageBase64;

      body.mimeType =
        body.images[0]
          .mimeType;
    }


    status.textContent =
      "投稿中…";


    const r =
      await fetch(
        "/api/publish",
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(
              body
            )
        }
      );


    let j;


    try {

      j =
        await r.json();

    } catch {

      throw new Error(
        `サーバー応答エラー (${r.status})`
      );
    }


    console.log(
      "publish response:",
      j
    );


    if (j.ok) {

      status.textContent =
        "✓ 投稿しました";

    } else {

      status.textContent =
        j.errors?.instagram ||
        j.errors?.x ||
        j.error ||
        "投稿できませんでした";
    }


  } catch (e) {

    console.error(
      e
    );


    status.textContent =
      e?.message ||
      "画像処理または接続でエラーが発生しました";


  } finally {

    send.disabled =
      false;

    addImages.disabled =
      false;

    clearImages.disabled =
      false;
  }
};


/* ========================================
   初期表示
======================================== */

renderPreview();
updateTimingUI();
updateScheduleDisplay();

</script>

</main>
</body>
</html>
