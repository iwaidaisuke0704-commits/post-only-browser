<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>POST ONLY</title>

  <style>
    *{box-sizing:border-box}

    body{
      margin:0;
      background:#f4f4f2;
      font-family:system-ui;
      color:#111
    }

    main{
      max-width:540px;
      min-height:100vh;
      margin:auto;
      background:#fff;
      padding:28px 20px
    }

    h1{margin:4px 0}
    .sub{color:#777}

    .pick{
      display:block;
      min-height:200px;
      border:2px dashed #bbb;
      border-radius:20px;
      overflow:hidden;
      cursor:pointer;
      padding:16px
    }

    #pickText{
      min-height:165px;
      display:grid;
      place-items:center;
      font-weight:800;
      text-align:center
    }

    #preview{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:10px
    }

    .previewItem{
      position:relative;
    }

    .previewItem img{
      display:block;
      width:100%;
      aspect-ratio:4/5;
      object-fit:contain;
      background:#fff;
      border-radius:12px;
      border:1px solid #eee
    }

    .removeImage{
      position:absolute;
      top:7px;
      right:7px;
      width:34px;
      height:34px;
      padding:0;
      border:0;
      border-radius:50%;
      background:rgba(0,0,0,.78);
      color:#fff;
      font-size:22px;
      font-weight:700;
      line-height:34px;
      cursor:pointer
    }

    .imageTools{
      display:none;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-top:10px
    }

    #imageCount{
      color:#666;
      font-size:14px;
      font-weight:700
    }

    #clearImages{
      width:auto;
      padding:9px 13px;
      border:1px solid #ddd;
      border-radius:10px;
      background:#fff;
      color:#555;
      font-size:13px;
      font-weight:700
    }

    textarea{
      width:100%;
      min-height:140px;
      margin-top:16px;
      border:1px solid #ddd;
      border-radius:16px;
      padding:14px;
      font:inherit
    }

    .targets{
      display:flex;
      gap:10px;
      margin:14px 0
    }

    .targets label{
      flex:1;
      border:1px solid #ddd;
      border-radius:14px;
      padding:14px
    }

    #send{
      width:100%;
      border:0;
      border-radius:16px;
      background:#111;
      color:#fff;
      padding:17px;
      font-size:17px;
      font-weight:800
    }

    button:disabled{
      opacity:.55
    }

    #status{
      text-align:center;
      min-height:52px;
      padding:16px;
      font-weight:750;
      overflow-wrap:anywhere
    }

    .note{
      text-align:center;
      color:#999;
      font-size:12px
    }
  </style>
</head>

<body>
<main>

  <h1>POST ONLY</h1>
  <p class="sub">見る機能はありません。投稿するだけ。</p>

  <label class="pick">
    <input
      id="file"
      type="file"
      accept="image/*"
      multiple
      hidden
    >

    <span id="pickText">
      画像を選ぶ<br>
      <small>Xは最大4枚 / Instagramは最大10枚</small>
    </span>

    <div id="preview"></div>
  </label>

  <div id="imageTools" class="imageTools">
    <span id="imageCount"></span>
    <button id="clearImages" type="button">
      全部消す
    </button>
  </div>

  <textarea
    id="caption"
    placeholder="投稿文"
  ></textarea>

  <div class="targets">

    <label>
      <input
        id="toX"
        type="checkbox"
        checked
      >
      X
    </label>

    <label>
      <input
        id="toIg"
        type="checkbox"
      >
      Instagram
    </label>

  </div>

  <button id="send">
    投稿する
  </button>

  <div id="status"></div>

  <div class="note">
    タイムライン・通知・いいね・コメントは取得しません。
  </div>


<script>

const file =
  document.querySelector("#file");

const preview =
  document.querySelector("#preview");

const pickText =
  document.querySelector("#pickText");

const imageTools =
  document.querySelector("#imageTools");

const imageCount =
  document.querySelector("#imageCount");

const clearImages =
  document.querySelector("#clearImages");

const caption =
  document.querySelector("#caption");

const toX =
  document.querySelector("#toX");

const toIg =
  document.querySelector("#toIg");

const send =
  document.querySelector("#send");

const status =
  document.querySelector("#status");


/*
  重要

  file.filesを直接投稿に使わず、
  この配列を「現在選択されている画像」
  として扱う。

  ×で消した画像は
  この配列からも消える。
*/

let selectedFiles = [];


/*
  プレビューを描き直す
*/

function renderPreview() {

  preview.innerHTML = "";


  if (!selectedFiles.length) {

    pickText.style.display =
      "grid";

    imageTools.style.display =
      "none";

    imageCount.textContent =
      "";

    return;
  }


  pickText.style.display =
    "none";

  imageTools.style.display =
    "flex";

  imageCount.textContent =
    `${selectedFiles.length}枚選択中`;


  selectedFiles.forEach(
    (f, index) => {

      const item =
        document.createElement("div");

      item.className =
        "previewItem";


      const img =
        document.createElement("img");

      const objectUrl =
        URL.createObjectURL(f);

      img.src =
        objectUrl;

      img.onload = () => {
        URL.revokeObjectURL(
          objectUrl
        );
      };


      const remove =
        document.createElement("button");

      remove.type =
        "button";

      remove.className =
        "removeImage";

      remove.textContent =
        "×";

      remove.setAttribute(
        "aria-label",
        `${index + 1}枚目を削除`
      );


      /*
        labelの中にボタンがあるので、
        画像選択画面が同時に開かないよう
        clickを止める。
      */

      remove.onclick = (e) => {

        e.preventDefault();
        e.stopPropagation();

        selectedFiles.splice(
          index,
          1
        );

        renderPreview();

        status.textContent =
          "";
      };


      item.appendChild(img);
      item.appendChild(remove);

      preview.appendChild(item);
    }
  );
}


/*
  新しく画像を選んだとき

  今回は「追加」ではなく
  新しい選択内容で置き換える。
*/

file.onchange = () => {

  const newFiles =
    Array.from(
      file.files || []
    );

  if (!newFiles.length) {
    return;
  }

  selectedFiles =
    newFiles;

  renderPreview();

  /*
    同じ画像をもう一度選択しても
    onchangeが動くようにリセット
  */

  file.value = "";
};


/*
  全画像削除
*/

clearImages.onclick = (e) => {

  e.preventDefault();
  e.stopPropagation();

  selectedFiles = [];

  file.value = "";

  renderPreview();

  status.textContent =
    "";
};


function b64(f) {

  return new Promise(
    (res, rej) => {

      const r =
        new FileReader();

      r.onload = () => {

        const result =
          String(r.result);

        res(
          result.split(",")[1]
        );
      };

      r.onerror = rej;

      r.readAsDataURL(f);
    }
  );
}


/*
  Instagram用画像生成

  元画像は切らない。

  1080 × 1350 の白いキャンバスに
  縦横比を維持したまま中央配置。
*/

async function makeInstagramImage(f) {

  const bitmap =
    await createImageBitmap(f);

  const canvas =
    document.createElement("canvas");

  const targetWidth =
    1080;

  const targetHeight =
    1350;

  canvas.width =
    targetWidth;

  canvas.height =
    targetHeight;

  const ctx =
    canvas.getContext("2d");

  ctx.fillStyle =
    "#ffffff";

  ctx.fillRect(
    0,
    0,
    targetWidth,
    targetHeight
  );

  const scale =
    Math.min(
      targetWidth /
        bitmap.width,

      targetHeight /
        bitmap.height
    );

  const drawWidth =
    Math.round(
      bitmap.width *
      scale
    );

  const drawHeight =
    Math.round(
      bitmap.height *
      scale
    );

  const x =
    Math.round(
      (
        targetWidth -
        drawWidth
      ) / 2
    );

  const y =
    Math.round(
      (
        targetHeight -
        drawHeight
      ) / 2
    );

  ctx.drawImage(
    bitmap,
    x,
    y,
    drawWidth,
    drawHeight
  );

  bitmap.close();

  const dataUrl =
    canvas.toDataURL(
      "image/jpeg",
      0.92
    );

  return {

    imageBase64:
      dataUrl.split(",")[1],

    mimeType:
      "image/jpeg"
  };
}


/*
  投稿
*/

send.onclick = async () => {

  const text =
    caption.value.trim();

  /*
    file.filesではなく
    selectedFilesを使う
  */

  const files =
    [...selectedFiles];


  if (!text) {

    status.textContent =
      "投稿文を入力してください";

    return;
  }


  if (
    !toX.checked &&
    !toIg.checked
  ) {

    status.textContent =
      "投稿先を選んでください";

    return;
  }


  if (
    toIg.checked &&
    files.length === 0
  ) {

    status.textContent =
      "Instagram投稿には画像が必要です";

    return;
  }


  if (
    toIg.checked &&
    files.length > 10
  ) {

    status.textContent =
      "Instagramは最大10枚です";

    return;
  }


  if (
    toX.checked &&
    files.length > 4
  ) {

    status.textContent =
      "Xは最大4枚です";

    return;
  }


  send.disabled = true;
  clearImages.disabled = true;

  status.textContent =
    "画像を準備しています…";


  try {

    const body = {

      caption:
        text,

      x:
        toX.checked,

      instagram:
        toIg.checked,

      /*
        Instagram用
      */

      images: [],

      /*
        X用
      */

      xImages: []
    };


    /*
      X用画像

      元画像をそのまま使う。
    */

    if (
      toX.checked &&
      files.length
    ) {

      for (
        let i = 0;
        i < files.length;
        i++
      ) {

        status.textContent =
          `X用画像を準備中… ${i + 1}/${files.length}`;

        body.xImages.push({

          imageBase64:
            await b64(
              files[i]
            ),

          mimeType:
            files[i].type ||
            "image/jpeg"
        });
      }
    }


    /*
      Instagram用画像

      1080 × 1350へ変換。
    */

    if (
      toIg.checked &&
      files.length
    ) {

      for (
        let i = 0;
        i < files.length;
        i++
      ) {

        status.textContent =
          `Instagram用画像を処理中… ${i + 1}/${files.length}`;

        const image =
          await makeInstagramImage(
            files[i]
          );

        body.images.push(
          image
        );
      }
    }


    /*
      旧1枚形式との互換性
    */

    if (
      body.xImages.length
    ) {

      body.imageBase64 =
        body.xImages[0]
          .imageBase64;

      body.mimeType =
        body.xImages[0]
          .mimeType;

    } else if (
      body.images.length
    ) {

      body.imageBase64 =
        body.images[0]
          .imageBase64;

      body.mimeType =
        body.images[0]
          .mimeType;
    }


    status.textContent =
      "投稿中…";


    const r =
      await fetch(
        "/api/publish",
        {
          method:
            "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(
              body
            )
        }
      );


    let j;

    try {

      j =
        await r.json();

    } catch {

      throw new Error(
        `サーバー応答エラー (${r.status})`
      );
    }


    console.log(
      "publish response:",
      j
    );


    if (j.ok) {

      status.textContent =
        "✓ 投稿しました";

    } else {

      status.textContent =
        j.errors?.instagram ||
        j.errors?.x ||
        j.error ||
        "投稿できませんでした";
    }


  } catch (e) {

    console.error(e);

    status.textContent =
      e?.message ||
      "画像処理または接続でエラーが発生しました";

  } finally {

    send.disabled = false;
    clearImages.disabled = false;
  }
};


renderPreview();

</script>

</main>
</body>
</html>
