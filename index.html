<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>POST ONLY</title>

  <style>
    *{box-sizing:border-box}

    body{
      margin:0;
      background:#f4f4f2;
      font-family:system-ui;
      color:#111
    }

    main{
      max-width:540px;
      min-height:100vh;
      margin:auto;
      background:#fff;
      padding:28px 20px
    }

    h1{margin:4px 0}
    .sub{color:#777}

    .pick{
      display:block;
      min-height:200px;
      border:2px dashed #bbb;
      border-radius:20px;
      overflow:hidden;
      cursor:pointer;
      padding:16px
    }

    #pickText{
      min-height:165px;
      display:grid;
      place-items:center;
      font-weight:800;
      text-align:center
    }

    #preview{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:10px
    }

    .previewItem{
      position:relative
    }

    .previewItem img{
      display:block;
      width:100%;
      aspect-ratio:4/5;
      object-fit:contain;
      background:#fff;
      border-radius:12px;
      border:1px solid #eee
    }

    .removeImage{
      position:absolute;
      top:7px;
      right:7px;
      width:34px;
      height:34px;
      padding:0;
      border:0;
      border-radius:50%;
      background:rgba(0,0,0,.78);
      color:#fff;
      font-size:22px;
      font-weight:700;
      line-height:34px;
      cursor:pointer
    }

    .imageTools{
      display:none;
      align-items:center;
      gap:8px;
      margin-top:10px
    }

    #imageCount{
      color:#666;
      font-size:14px;
      font-weight:700;
      margin-right:auto;
      white-space:nowrap
    }

    #addImages,
    #clearImages{
      width:auto;
      padding:10px 12px;
      border:1px solid #ddd;
      border-radius:10px;
      background:#fff;
      color:#333;
      font-size:13px;
      font-weight:700;
      cursor:pointer
    }

    #addImages{
      background:#111;
      color:#fff;
      border-color:#111
    }

    textarea{
      width:100%;
      min-height:140px;
      margin-top:16px;
      border:1px solid #ddd;
      border-radius:16px;
      padding:14px;
      font:inherit
    }

    .targets{
      display:flex;
      gap:10px;
      margin:14px 0
    }

    .targets label{
      flex:1;
      border:1px solid #ddd;
      border-radius:14px;
      padding:14px
    }

    /* =====================================
       投稿タイミング
    ===================================== */

    .timing{
      margin:14px 0;
      border:1px solid #ddd;
      border-radius:16px;
      padding:14px
    }

    .timingTitle{
      margin-bottom:12px;
      font-size:14px;
      font-weight:800
    }

    .timingChoices{
      display:flex;
      gap:10px
    }

    .timingChoices label{
      flex:1;
      display:flex;
      align-items:center;
      gap:7px;
      padding:12px;
      border:1px solid #ddd;
      border-radius:12px;
      cursor:pointer
    }

    /* =====================================
       予約日時
    ===================================== */

    #scheduleBox{
      display:none;
      margin-top:14px
    }

    #scheduleLabel{
      margin-bottom:8px;
      color:#666;
      font-size:13px;
      font-weight:800
    }

    #scheduleButton{
      width:100%;
      min-height:58px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:14px 16px;
      border:1px solid #ddd;
      border-radius:12px;
      background:#fff;
      color:#555;
      font:inherit;
      font-size:16px;
      font-weight:750;
      text-align:left;
      cursor:pointer
    }

    #scheduleButton.selected{
      color:#111;
      border-color:#111
    }

    .scheduleButtonText{
      display:flex;
      align-items:center;
      gap:9px
    }

    .scheduleArrow{
      font-size:22px;
      color:#777;
      line-height:1
    }

    /*
      本物のdatetime-local。

      完全にdisplay:noneにはしない。
      ブラウザによってshowPickerが
      動かなくなるのを避ける。
    */

    #scheduleAt{
      position:fixed;
      left:-10000px;
      bottom:0;
      width:1px;
      height:1px;
      opacity:.01;
      border:0;
      padding:0
    }

    /* =====================================
       投稿ボタン
    ===================================== */

    #send{
      width:100%;
      border:0;
      border-radius:16px;
      background:#111;
      color:#fff;
      padding:17px;
      font-size:17px;
      font-weight:800;
      cursor:pointer
    }

    button:disabled{
      opacity:.55
    }

    #status{
      text-align:center;
      min-height:52px;
      padding:16px;
      font-weight:750;
      overflow-wrap:anywhere
    }

    #status.error{
      color:#b00020;
      background:#fff0f2;
      border:1px solid #ffc8d0;
      border-radius:12px;
      margin-top:12px;
      text-align:left;
      font-size:13px
    }

    .note{
      text-align:center;
      color:#999;
      font-size:12px
    }
  </style>
</head>

<body>
<main>

  <h1>POST ONLY</h1>

  <p class="sub">
    見る機能はありません。投稿するだけ。
  </p>

  <!-- ===================================
       画像
  ==================================== -->

  <label class="pick">

    <input
      id="file"
      type="file"
      accept="image/*"
      multiple
      hidden
    >

    <span id="pickText">
      画像を選ぶ<br>
      <small>
        Xは最大4枚 / Instagramは最大10枚
      </small>
    </span>

    <div id="preview"></div>

  </label>

  <div
    id="imageTools"
    class="imageTools"
  >

    <span id="imageCount"></span>

    <button
      id="addImages"
      type="button"
    >
      ＋ 画像を追加
    </button>

    <button
      id="clearImages"
      type="button"
    >
      全部消す
    </button>

  </div>

  <!-- ===================================
       投稿文
  ==================================== -->

  <textarea
    id="caption"
    placeholder="投稿文"
  ></textarea>

  <!-- ===================================
       投稿先
  ==================================== -->

  <div class="targets">

    <label>
      <input
        id="toX"
        type="checkbox"
        checked
      >
      X
    </label>

    <label>
      <input
        id="toIg"
        type="checkbox"
      >
      Instagram
    </label>

  </div>

  <!-- ===================================
       投稿タイミング
  ==================================== -->

  <div class="timing">

    <div class="timingTitle">
      投稿タイミング
    </div>

    <div class="timingChoices">

      <label>
        <input
          id="postNow"
          type="radio"
          name="timing"
          value="now"
          checked
        >
        今すぐ
      </label>

      <label>
        <input
          id="postLater"
          type="radio"
          name="timing"
          value="scheduled"
        >
        予約
      </label>

    </div>

    <div id="scheduleBox">

      <div id="scheduleLabel">
        予約日時
      </div>

      <button
        id="scheduleButton"
        type="button"
      >
        <span
          id="scheduleButtonText"
          class="scheduleButtonText"
        >
          📅 日時を選ぶ
        </span>

        <span class="scheduleArrow">
          ›
        </span>
      </button>

      <input
        id="scheduleAt"
        type="datetime-local"
        aria-label="予約日時"
      >

    </div>

  </div>

  <!-- ===================================
       投稿ボタン
  ==================================== -->

  <button id="send">
    投稿する
  </button>

  <div id="status"></div>

  <div class="note">
    タイムライン・通知・いいね・コメントは取得しません。
  </div>


<script>

/* ========================================
   エラー表示
======================================== */

function showError(message) {

  const el =
    document.querySelector("#status");

  if (!el) {
    alert(message);
    return;
  }

  el.classList.add("error");

  el.textContent =
    message;
}


function clearErrorStyle() {

  const el =
    document.querySelector("#status");

  if (el) {
    el.classList.remove("error");
  }
}


window.addEventListener(
  "error",
  (event) => {

    console.error(
      "JavaScript Error:",
      event.error || event
    );

    const line =
      event.lineno
        ? ` / 行:${event.lineno}`
        : "";

    const column =
      event.colno
        ? `:${event.colno}`
        : "";

    showError(
      `JSエラー: ${event.message || "不明なエラー"}${line}${column}`
    );
  }
);


window.addEventListener(
  "unhandledrejection",
  (event) => {

    console.error(
      "Unhandled Promise Rejection:",
      event.reason
    );

    const reason =
      event.reason?.message ||
      String(
        event.reason ||
        "不明なエラー"
      );

    showError(
      `Promiseエラー: ${reason}`
    );
  }
);


/* ========================================
   DOM取得
======================================== */

const file =
  document.querySelector("#file");

const preview =
  document.querySelector("#preview");

const pickText =
  document.querySelector("#pickText");

const imageTools =
  document.querySelector("#imageTools");

const imageCount =
  document.querySelector("#imageCount");

const addImages =
  document.querySelector("#addImages");

const clearImages =
  document.querySelector("#clearImages");

const caption =
  document.querySelector("#caption");

const toX =
  document.querySelector("#toX");

const toIg =
  document.querySelector("#toIg");

const send =
  document.querySelector("#send");

const status =
  document.querySelector("#status");

const postNow =
  document.querySelector("#postNow");

const postLater =
  document.querySelector("#postLater");

const scheduleBox =
  document.querySelector("#scheduleBox");

const scheduleButton =
  document.querySelector("#scheduleButton");

const scheduleButtonText =
  document.querySelector("#scheduleButtonText");

const scheduleAt =
  document.querySelector("#scheduleAt");


/* ========================================
   現在選択中の画像
======================================== */

let selectedFiles = [];


/* ========================================
   予約UI
======================================== */

function updateTimingUI() {

  if (postLater.checked) {

    scheduleBox.style.display =
      "block";

    send.textContent =
      "投稿を予約する";

  } else {

    scheduleBox.style.display =
      "none";

    send.textContent =
      "投稿する";
  }
}


postNow.addEventListener(
  "change",
  updateTimingUI
);

postLater.addEventListener(
  "change",
  updateTimingUI
);


/* ========================================
   予約日時 最小値
======================================== */

function updateMinimumScheduleTime() {

  const now =
    new Date();

  const local =
    new Date(
      now.getTime() -
      now.getTimezoneOffset() *
      60000
    );

  scheduleAt.min =
    local
      .toISOString()
      .slice(0,16);
}


updateMinimumScheduleTime();


/* ========================================
   日時選択ボタン
======================================== */

scheduleButton.addEventListener(
  "click",
  () => {

    clearErrorStyle();

    updateMinimumScheduleTime();

    try {

      if (
        typeof scheduleAt.showPicker ===
        "function"
      ) {

        scheduleAt.showPicker();

        return;
      }

    } catch (error) {

      console.log(
        "showPicker fallback:",
        error
      );
    }

    /*
      showPicker非対応ブラウザ用
    */

    scheduleAt.focus();

    scheduleAt.click();
  }
);


/* ========================================
   日時表示
======================================== */

function updateScheduleButton() {

  if (!scheduleAt.value) {

    scheduleButtonText.textContent =
      "📅 日時を選ぶ";

    scheduleButton.classList.remove(
      "selected"
    );

    return;
  }


  const date =
    new Date(
      scheduleAt.value
    );


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    scheduleButtonText.textContent =
      "📅 日時を選ぶ";

    scheduleButton.classList.remove(
      "selected"
    );

    return;
  }


  const year =
    date.getFullYear();

  const month =
    String(
      date.getMonth() + 1
    ).padStart(2,"0");

  const day =
    String(
      date.getDate()
    ).padStart(2,"0");

  const hour =
    String(
      date.getHours()
    ).padStart(2,"0");

  const minute =
    String(
      date.getMinutes()
    ).padStart(2,"0");


  scheduleButtonText.textContent =
    `📅 ${year}/${month}/${day} ${hour}:${minute}`;


  scheduleButton.classList.add(
    "selected"
  );
}


scheduleAt.addEventListener(
  "change",
  updateScheduleButton
);

scheduleAt.addEventListener(
  "input",
  updateScheduleButton
);


/* ========================================
   プレビュー
======================================== */

function renderPreview() {

  preview.innerHTML = "";


  if (!selectedFiles.length) {

    pickText.style.display =
      "grid";

    imageTools.style.display =
      "none";

    imageCount.textContent =
      "";

    return;
  }


  pickText.style.display =
    "none";

  imageTools.style.display =
    "flex";

  imageCount.textContent =
    `${selectedFiles.length}枚選択中`;


  selectedFiles.forEach(
    (f, index) => {

      const item =
        document.createElement("div");

      item.className =
        "previewItem";


      const img =
        document.createElement("img");

      const objectUrl =
        URL.createObjectURL(f);

      img.src =
        objectUrl;


      img.onload = () => {

        URL.revokeObjectURL(
          objectUrl
        );
      };


      img.onerror = () => {

        URL.revokeObjectURL(
          objectUrl
        );

        showError(
          `画像${index + 1}のプレビューを表示できませんでした`
        );
      };


      const remove =
        document.createElement("button");

      remove.type =
        "button";

      remove.className =
        "removeImage";

      remove.textContent =
        "×";

      remove.setAttribute(
        "aria-label",
        `${index + 1}枚目を削除`
      );


      remove.addEventListener(
        "click",
        (e) => {

          e.preventDefault();
          e.stopPropagation();

          selectedFiles.splice(
            index,
            1
          );

          renderPreview();

          clearErrorStyle();

          status.textContent =
            "";
        }
      );


      item.appendChild(
        img
      );

      item.appendChild(
        remove
      );

      preview.appendChild(
        item
      );
    }
  );
}


/* ========================================
   画像追加
======================================== */

addImages.addEventListener(
  "click",
  (e) => {

    e.preventDefault();
    e.stopPropagation();

    file.click();
  }
);


/* ========================================
   画像選択
======================================== */

file.addEventListener(
  "change",
  () => {

    clearErrorStyle();

    const newFiles =
      Array.from(
        file.files || []
      );


    if (!newFiles.length) {
      return;
    }


    selectedFiles = [
      ...selectedFiles,
      ...newFiles
    ];


    if (
      selectedFiles.length > 10
    ) {

      selectedFiles =
        selectedFiles.slice(
          0,
          10
        );

      status.textContent =
        "画像は最大10枚までです";

    } else {

      status.textContent =
        "";
    }


    renderPreview();

    /*
      同じ画像をもう一度
      選択可能にする
    */

    file.value = "";
  }
);


/* ========================================
   全画像削除
======================================== */

clearImages.addEventListener(
  "click",
  (e) => {

    e.preventDefault();
    e.stopPropagation();

    selectedFiles = [];

    file.value = "";

    renderPreview();

    clearErrorStyle();

    status.textContent =
      "";
  }
);


/* ========================================
   Base64
======================================== */

function b64(f) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();


      reader.onload = () => {

        const result =
          String(
            reader.result
          );

        const commaIndex =
          result.indexOf(",");

        if (commaIndex === -1) {

          reject(
            new Error(
              "画像のBase64変換に失敗しました"
            )
          );

          return;
        }

        resolve(
          result.slice(
            commaIndex + 1
          )
        );
      };


      reader.onerror = () => {

        reject(
          reader.error ||
          new Error(
            "画像の読み込みに失敗しました"
          )
        );
      };


      reader.readAsDataURL(
        f
      );
    }
  );
}


/* ========================================
   Instagram画像生成
======================================== */

async function makeInstagramImage(f) {

  const bitmap =
    await createImageBitmap(
      f
    );


  const canvas =
    document.createElement(
      "canvas"
    );


  const targetWidth =
    1080;

  const targetHeight =
    1350;


  canvas.width =
    targetWidth;

  canvas.height =
    targetHeight;


  const ctx =
    canvas.getContext("2d");


  if (!ctx) {

    bitmap.close();

    throw new Error(
      "画像処理用Canvasを作成できませんでした"
    );
  }


  ctx.fillStyle =
    "#ffffff";


  ctx.fillRect(
    0,
    0,
    targetWidth,
    targetHeight
  );


  const scale =
    Math.min(

      targetWidth /
        bitmap.width,

      targetHeight /
        bitmap.height
    );


  const drawWidth =
    Math.round(
      bitmap.width *
      scale
    );


  const drawHeight =
    Math.round(
      bitmap.height *
      scale
    );


  const x =
    Math.round(
      (
        targetWidth -
        drawWidth
      ) / 2
    );


  const y =
    Math.round(
      (
        targetHeight -
        drawHeight
      ) / 2
    );


  ctx.drawImage(
    bitmap,
    x,
    y,
    drawWidth,
    drawHeight
  );


  bitmap.close();


  const dataUrl =
    canvas.toDataURL(
      "image/jpeg",
      0.92
    );


  return {

    imageBase64:
      dataUrl.split(",")[1],

    mimeType:
      "image/jpeg"
  };
}


/* ========================================
   投稿
======================================== */

send.addEventListener(
  "click",
  async () => {

    clearErrorStyle();


    const text =
      caption.value.trim();


    const files =
      [...selectedFiles];


    if (!text) {

      status.textContent =
        "投稿文を入力してください";

      return;
    }


    if (
      !toX.checked &&
      !toIg.checked
    ) {

      status.textContent =
        "投稿先を選んでください";

      return;
    }


    if (
      toIg.checked &&
      files.length === 0
    ) {

      status.textContent =
        "Instagram投稿には画像が必要です";

      return;
    }


    if (
      toIg.checked &&
      files.length > 10
    ) {

      status.textContent =
        "Instagramは最大10枚です";

      return;
    }


    if (
      toX.checked &&
      files.length > 4
    ) {

      status.textContent =
        "Xは最大4枚です";

      return;
    }


    /* ====================================
       予約
    ==================================== */

    if (postLater.checked) {

      if (!scheduleAt.value) {

        status.textContent =
          "予約日時を選んでください";

        return;
      }


      const scheduledDate =
        new Date(
          scheduleAt.value
        );


      if (
        Number.isNaN(
          scheduledDate.getTime()
        )
      ) {

        status.textContent =
          "予約日時が正しくありません";

        return;
      }


      if (
        scheduledDate.getTime() <=
        Date.now()
      ) {

        status.textContent =
          "未来の日時を選んでください";

        return;
      }


      /*
        まだ予約APIには送らない。

        ここまで動けば
        フロント側の予約UIは正常。
      */

      status.textContent =
        "✓ 予約日時OK。次にサーバー側を接続します";

      return;
    }


    /* ====================================
       今すぐ投稿
    ==================================== */

    send.disabled =
      true;

    addImages.disabled =
      true;

    clearImages.disabled =
      true;


    status.textContent =
      "画像を準備しています…";


    try {

      const body = {

        caption:
          text,

        x:
          toX.checked,

        instagram:
          toIg.checked,

        images: [],

        xImages: []
      };


      /* ==================================
         X画像

         Promise.allで並列変換
      ================================== */

      if (
        toX.checked &&
        files.length
      ) {

        status.textContent =
          `X用画像を準備中… ${files.length}枚`;


        body.xImages =
          await Promise.all(

            files.map(
              async (f) => ({

                imageBase64:
                  await b64(f),

                mimeType:
                  f.type ||
                  "image/jpeg"
              })
            )
          );
      }


      /* ==================================
         Instagram画像

         Promise.allで並列変換
      ================================== */

      if (
        toIg.checked &&
        files.length
      ) {

        status.textContent =
          `Instagram用画像を処理中… ${files.length}枚`;


        body.images =
          await Promise.all(

            files.map(
              (f) =>
                makeInstagramImage(f)
            )
          );
      }


      /* ==================================
         旧形式互換
      ================================== */

      if (
        body.xImages.length
      ) {

        body.imageBase64 =
          body.xImages[0]
            .imageBase64;

        body.mimeType =
          body.xImages[0]
            .mimeType;

      } else if (
        body.images.length
      ) {

        body.imageBase64 =
          body.images[0]
            .imageBase64;

        body.mimeType =
          body.images[0]
            .mimeType;
      }


      status.textContent =
        "投稿中…";


      const response =
        await fetch(
          "/api/publish",
          {
            method:
              "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify(
                body
              )
          }
        );


      let result;


      try {

        result =
          await response.json();

      } catch {

        throw new Error(
          `サーバー応答エラー (${response.status})`
        );
      }


      console.log(
        "publish response:",
        result
      );


      if (
        response.ok &&
        result.ok
      ) {

        status.textContent =
          "✓ 投稿しました";

      } else {

        throw new Error(
          result.errors?.instagram ||
          result.errors?.x ||
          result.error ||
          `投稿できませんでした (${response.status})`
        );
      }


    } catch (error) {

      console.error(
        "Publish error:",
        error
      );


      showError(
        error?.message ||
        "画像処理または接続でエラーが発生しました"
      );


    } finally {

      send.disabled =
        false;

      addImages.disabled =
        false;

      clearImages.disabled =
        false;
    }
  }
);


/* ========================================
   初期化
======================================== */

renderPreview();

updateTimingUI();

updateScheduleButton();

</script>

</main>
</body>
</html>
