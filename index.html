<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POST ONLY</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f4f2;font-family:system-ui;color:#111}main{max-width:540px;min-height:100vh;margin:auto;background:#fff;padding:28px 20px}h1{margin:4px 0}.sub{color:#777}.pick{display:grid;place-items:center;min-height:200px;border:2px dashed #bbb;border-radius:20px;overflow:hidden;font-weight:800}.pick img{display:none;width:100%;max-height:360px;object-fit:contain}textarea{width:100%;min-height:140px;margin-top:16px;border:1px solid #ddd;border-radius:16px;padding:14px;font:inherit}.targets{display:flex;gap:10px;margin:14px 0}.targets label{flex:1;border:1px solid #ddd;border-radius:14px;padding:14px}button{width:100%;border:0;border-radius:16px;background:#111;color:#fff;padding:17px;font-size:17px;font-weight:800}#status{text-align:center;min-height:52px;padding:16px;font-weight:750}.note{text-align:center;color:#999;font-size:12px}</style></head><body><main><h1>POST ONLY</h1><p class="sub">見る機能はありません。投稿するだけ。</p><label class="pick"><input id="file" type="file" accept="image/*" hidden><span id="pickText">画像を選ぶ</span><img id="preview"></label><textarea id="caption" placeholder="投稿文"></textarea><div class="targets"><label><input id="toX" type="checkbox" checked> X</label><label><input id="toIg" type="checkbox"> Instagram</label></div><button id="send">投稿する</button><div id="status"></div><div class="note">タイムライン・通知・いいね・コメントは取得しません。</div><script>
const file=document.querySelector("#file"),preview=document.querySelector("#preview"),pickText=document.querySelector("#pickText"),caption=document.querySelector("#caption"),toX=document.querySelector("#toX"),toIg=document.querySelector("#toIg"),send=document.querySelector("#send"),status=document.querySelector("#status");
file.onchange=()=>{if(!file.files[0])return;preview.src=URL.createObjectURL(file.files[0]);preview.style.display="block";pickText.style.display="none"};
function b64(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(f)})}
send.onclick=async()=>{if(!file.files[0]){status.textContent="画像を選んでください";return}send.disabled=true;status.textContent="投稿中…";try{const r=await fetch("/api/publish",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({caption:caption.value,imageBase64:await b64(file.files[0]),mimeType:file.files[0].type||"image/jpeg",x:toX.checked,instagram:toIg.checked})});const j=await r.json();status.textContent=j.ok?"✓ 投稿しました":(j.errors?.x||j.error||"投稿できませんでした");console.log(j)}catch(e){status.textContent="接続エラー"}finally{send.disabled=false}};
</script></main></body></html>
